[tool.poetry]
name = "c2pie"
version = "0.1.1"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"


[project]
name = "c2pie"
description = "c2pie is a Python library that provides C2PA standard functionality."
readme = 'README.md'
authors = [ 
  { name="Tourmaline Core", email="contact@tourmalinecore.com" },
]
license = {file = 'LICENSE'}
requires-python = '>=3.9.2'
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    'Operating System :: Microsoft :: Windows',
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/TourmalineCore/c2pie"
Issues = "https://github.com/TourmalineCore/c2pie/issues"

[project.scripts]
c2pie = 'c2pie.main:main'

[tool.poetry.dependencies]
python = ">=3.9.2,<3.15"
cbor2 = "^5.9.0"
cryptography = ">=50.0.0"
pytz = "^2024.2"
cffi = "<=2.0.0"
pypdf = "^6.15.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.4"
pytest-cov = "^7.1.0"
ruff = "^0.13.3"

[build-system]
requires = ["poetry>=1.8.3"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
markers = [
    "e2e: marks tests as e2e",
]

[tool.coverage.run]
omit = [
  "*_test.py",
  "*/__init__.py",
]

[tool.coverage.report]
show_missing = true

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "docs"]
parse_squash_commits = true
ignore_merge_commits = true
allowed_tags = ['feat', 'fix', 'build', 'chore', 'ci', 'docs', 'style', 'refactor', 'test', 'config']

