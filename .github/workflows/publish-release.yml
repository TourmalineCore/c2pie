name: Create and publish release 

on:
  push:
    branches:
      # Main branches group
      - 'master'
      - 'release/*'
      - 'hotfix/*'
      - 'develop'
      # Maintenace branches group
      - '*/master'
      - '*/release/*'
      - '*/hotfix/*'
      - '*/develop'
  # If this trigger is removed, then in the event that a release 
  # publication is terminated for unknown reasons (for example, 
  # an attempt to publish an existing tag), it will be difficult 
  # to restart the workflow without publishing a new commit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_release:
    name: Create and publish release 
    runs-on: ubuntu-24.04

    # Controls whether multiple instances of 
    # the same workflow can run in parallel
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}

    steps:      
      - name: Checkout repository on release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # If set to 'true', the semantic-release service commit will be 
          # pushed using the token defined for actions/checkout (by default, 
          # 'GITHUB_TOKEN', which is critical for protected branches)
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
      
      # [!] Start of the stack-dependent section

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true

      # [!] End of the stack-dependent section

      - name: Install semantic-release and plugins
        run: |
          npm install \
            semantic-release@25.0.3 \
            @semantic-release/exec@7.1.0 \
            @semantic-release/commit-analyzer@13.0.1 \
            @semantic-release/release-notes-generator@14.1.1 \
            @semantic-release/changelog@6.0.3 \
            @semantic-release/git@10.0.1 \
            @semantic-release/github@12.0.8 \
            conventional-changelog-conventionalcommits@9.3.1
      
      - name: Semantic Version Release
        id: semantic_version_release
        env:
          # this token should have at lease these permissions:
          #   contents: write # to be able to publish a GitHub release
          #   issues: write # to be able to comment on released issues
          #   pull-requests: write # to be able to comment on released pull requests
          GH_TOKEN: ${{ secrets.C2PIE_SEMANTIC_RELEASE_GH_TOKEN   }}
        run: |
          npx semantic-release