name: Secrets Detection

on:
  # Need to conduct detection on push so that secrets don't get commited to the remote repo
  push:

jobs:
  check-for-secrets:
    name: Check that there are no hard-coded secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp/gitleaks gitleaks
          sudo mv /tmp/gitleaks/gitleaks /usr/local/bin/

      - name: Scan repository
        run: |
          gitleaks dir . --verbose --config .gitleaks.toml