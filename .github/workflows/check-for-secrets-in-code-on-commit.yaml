name: Secrets Detection

on:
  # Need to conduct detection on push so that secrets don't get commited to the remote repo
  push:

jobs:
  check-for-secrets:
    name: Check that there are no hard-coded secrets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          # Installing to the tmp folder cause installing to the working directory leads to detecting example secrets from gitleaks itself
          mkdir -p /tmp/gitleaks
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /tmp/gitleaks gitleaks
          sudo mv /tmp/gitleaks/gitleaks /usr/local/bin/

      # This action scans the whole git history for secret detection
      # c2pie repo has less than a thousand commits, so we're fine with scanning the repo fully for now
      # However, it's not the most optimal approach, especially for larger repos
      # TODO: To avoid scanning the whole repo, we can add an artifact storing the commit hash of the last check for secrets
      # And use this command instead: gitleaks git -v --log-opts="--all commitA..commitB", where:
      # commitA - commit hash from the artifact (basically previous secrets checkpoint)
      # commitB - the commit to which we need to check for secrets - ${{ github.sha }}

      - name: Scan repository
        run: |
          gitleaks git . --verbose --config .gitleaks.toml
